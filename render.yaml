services:
  - type: web
    name: curasys-hms-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: CLINIC_START_HOUR
        value: "8"
      - key: CLINIC_END_HOUR
        value: "20"
      - key: CLIENT_ORIGIN
        value: https://curasys-hms.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_KEY
        generateValue: true
  - type: web
    name: curasys-hms
    runtime: static
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://curasys-hms-api.onrender.com/api
      - key: VITE_CLINIC_START_HOUR
        value: "8"
      - key: VITE_CLINIC_END_HOUR
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
